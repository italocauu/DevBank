---
server:
    port: 8081
grails:
    profile: web
    codegen:
        defaultPackage: devbank
    spring:
        transactionManagement:
            proxies: false
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
info:
    app:
        name: "@info.app.name@"
        version: "@info.app.version@"
        grailsVersion: "@info.app.grailsVersion@"
spring:
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false

# Spring Actuator Endpoints are Disabled by Default
endpoints:
    enabled: false
    jmx:
        enabled: true

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: "*/*"
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
                - text/html
                - application/xhtml+xml
            js: text/javascript
            json:
                - application/json
                - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
                - application/hal+json
                - application/hal+xml
            xml:
                - text/xml
                - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlets: html
                taglib: none
                staticparts: none
endpoints:
    jmx:
        unique-names: true

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
    #hbm2ddl:
    #   auto: update
dataSource:
    pooled: true
    jmxExport: true
environments:
    development:
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://localhost:5432/devbank?currentSchema=public
            driverClassName: org.postgresql.Driver
            dialect: org.hibernate.dialect.PostgreSQLDialect
            username: "Ailot"
            password: "pokemon"
    test:
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://localhost:5432/devbank_test?currentSchema=public
            username: "Ailot"
            password: "pokemon"
    production:
        dataSource:
            dbCreate: none
            url: jdbc:postgresql://localhost:5432/devbank_prod?currentSchema=public
            username: "Ailot"
            password: "pokemon"
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED
---
devbank:
    jwt:
        # Caminhos default (dev): se os arquivos não existirem, a RsaKeyService gera
        # um par novo de 2048 bits automaticamente na primeira subida.
        # Em produção, gere as chaves com openssl e aponte pra elas via env var —
        # DEVBANK_JWT_PRIVATEKEYPATH / DEVBANK_JWT_PUBLICKEYPATH (Spring Boot faz o
        # bind automático) — nunca deixe a privada nascer sozinha num restart de prod.
        privateKeyPath: keys/jwt_private_key.pem
        publicKeyPath: keys/jwt_public_key.pem
---
grails:
    plugin:
        springsecurity:
            userLookup:
                userDomainClassName: devbank.auth.User
                authorityJoinClassName: devbank.auth.UserPermission
            authority:
                className: devbank.auth.Permission
            password:
                algorithm: bcrypt
            successHandler:
                alwaysUseDefault: false
            roleAfterLoginUrl:
                ROLE_CLIENT: /api/client
                ROLE_TELLER: /api/teller
                ROLE_MANAGER: /api/manager
                ROLE_DEV: /api/dev
---
logging:
    level:
        grails.plugin.springsecurity: DEBUG
        org.springframework.springsecurity: DEBUG